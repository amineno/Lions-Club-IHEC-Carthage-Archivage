<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6D24E"/>
      <stop offset="50%" stop-color="#E0A920"/>
      <stop offset="100%" stop-color="#9D7208"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F1C33A"/>
      <stop offset="100%" stop-color="#C99A10"/>
    </linearGradient>
    <radialGradient id="navyBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0E3B74"/>
      <stop offset="100%" stop-color="#051C3B"/>
    </radialGradient>
    <linearGradient id="lGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE06A"/>
      <stop offset="55%" stop-color="#E9B61C"/>
      <stop offset="100%" stop-color="#A9790A"/>
    </linearGradient>
    <clipPath id="emblemClip"><circle cx="256" cy="256" r="238"/></clipPath>
  </defs>

  <!-- Navy background square (rounded for favicon) -->
  <rect width="512" height="512" rx="96" fill="url(#navyBg)"/>

  <!-- Outer navy disc within -->
  <g clip-path="url(#emblemClip)">
    <!-- Wreath leaves (laurel) arcs -->
    <g stroke="url(#goldGrad2)" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.92">
      <path d="M92 200 C 96 252 110 310 156 362" />
      <path d="M420 200 C 416 252 402 310 356 362" />
    </g>
    <g fill="url(#goldGrad2)" opacity="0.95">
      <!-- Left laurel leaves -->
      <path d="M110 198 q-14 -4 -24 4 q10 18 26 12 z"/>
      <path d="M100 236 q-18 -2 -22 16 q14 16 28 2 z"/>
      <path d="M102 276 q-20 4 -18 26 q18 10 26 -10 z"/>
      <path d="M114 320 q-18 12 -8 32 q20 8 22 -16 z"/>
      <path d="M142 360 q-14 18 4 34 q24 2 20 -22 z"/>
      <!-- Right laurel leaves -->
      <path d="M402 198 q14 -4 24 4 q-10 18 -26 12 z"/>
      <path d="M412 236 q18 -2 22 16 q-14 16 -28 2 z"/>
      <path d="M410 276 q20 4 18 26 q-18 10 -26 -10 z"/>
      <path d="M398 320 q18 12 8 32 q-20 8 -22 -16 z"/>
      <path d="M370 360 q14 18 -4 34 q-24 2 -20 -22 z"/>
    </g>

    <!-- Gold separator ticks -->
    <g stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round">
      <line x1="140" y1="154" x2="170" y2="172"/>
      <line x1="372" y1="154" x2="342" y2="172"/>
      <line x1="92"  y1="262" x2="122" y2="262"/>
      <line x1="420" y1="262" x2="390" y2="262"/>
      <line x1="158" y1="400" x2="136" y2="378"/>
      <line x1="354" y1="400" x2="376" y2="378"/>
    </g>

    <!-- Central badge (yellow Lions circle) -->
    <circle cx="256" cy="248" r="140" fill="url(#goldGrad)" stroke="#6A4706" stroke-width="2"/>
    <!-- Lions blue ring -->
    <circle cx="256" cy="248" r="118" fill="#0B3264" stroke="#6A4706" stroke-width="1.5"/>

    <!-- LIONS text arc top -->
    <g font-family="Georgia, 'Times New Roman', serif" font-weight="900" letter-spacing="6" fill="#0A2B5A">
      <text x="256" y="172" text-anchor="middle" font-size="64">LIONS</text>
    </g>

    <!-- INTERNATIONAL text arc bottom -->
    <g font-family="Georgia, 'Times New Roman', serif" font-weight="700" letter-spacing="5" fill="#0A2B5A">
      <text x="256" y="336" text-anchor="middle" font-size="44">INTERNATIONAL</text>
    </g>

    <!-- Central "L" -->
    <g transform="translate(256 248)">
      <rect x="-36" y="-64" width="24" height="100" rx="3" fill="url(#lGold)" stroke="#6A4706" stroke-width="1"/>
      <rect x="-36" y="22"  width="78" height="24" rx="3" fill="url(#lGold)" stroke="#6A4706" stroke-width="1"/>
    </g>

    <!-- Two lion heads (stylized silhouettes) -->
    <g fill="#0A2B5A">
      <!-- Left lion -->
      <path d="M 138 240
               c -2 -38 16 -62 44 -68
               c 6 -16 22 -30 44 -30
               c -8 16 -6 36 6 50
               c -18 10 -28 30 -22 50
               c -22 4 -40 -2 -52 -20 z"/>
      <!-- Left ear + mane -->
      <path d="M 168 152 c -20 -4 -34 10 -30 30 c 8 -14 22 -20 30 -30 z" opacity="0.85"/>
      <!-- Left eye -->
      <circle cx="200" cy="214" r="5" fill="url(#goldGrad)"/>
      <!-- Left nose -->
      <path d="M 148 244 l 8 6 l -14 2 z"/>
      <!-- Left mouth -->
      <path d="M 144 256 q 8 10 20 6" stroke="url(#goldGrad)" stroke-width="3" fill="none"/>

      <!-- Right lion -->
      <path d="M 374 240
               c 2 -38 -16 -62 -44 -68
               c -6 -16 -22 -30 -44 -30
               c 8 16 6 36 -6 50
               c 18 10 28 30 22 50
               c 22 4 40 -2 52 -20 z"/>
      <!-- Right ear + mane -->
      <path d="M 344 152 c 20 -4 34 10 30 30 c -8 -14 -22 -20 -30 -30 z" opacity="0.85"/>
      <!-- Right eye -->
      <circle cx="312" cy="214" r="5" fill="url(#goldGrad)"/>
      <!-- Right nose -->
      <path d="M 364 244 l -8 6 l 14 2 z"/>
      <!-- Right mouth -->
      <path d="M 368 256 q -8 10 -20 6" stroke="url(#goldGrad)" stroke-width="3" fill="none"/>
    </g>

    <!-- Club banner years bottom -->
    <g fill="#0A2B5A" font-family="Georgia, serif" font-weight="800">
      <text x="162" y="422" font-size="34">1917</text>
      <text x="326" y="422" font-size="34">2027</text>
    </g>
    <!-- Small center star at bottom (IHEC torch) -->
    <g transform="translate(256 432)" fill="url(#goldGrad2)" stroke="#6A4706" stroke-width="1">
      <path d="M0 -16 L4 -4 L16 -4 L6 4 L10 16 L0 8 L-10 16 L-6 4 L-16 -4 L-4 -4 Z"/>
    </g>
    <g stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" fill="none">
      <line x1="198" y1="414" x2="226" y2="424"/>
      <line x1="314" y1="414" x2="286" y2="424"/>
      <line x1="170" y1="392" x2="194" y2="400"/>
      <line x1="342" y1="392" x2="318" y2="400"/>
    </g>
  </g>

  <!-- Outer bezel -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.9"/>
</svg>
